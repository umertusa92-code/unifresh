<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniFresh - Freshman Courses</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: #2563eb;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .course {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .course h2 {
      color: #2563eb;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .course p {
      color: #666;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 2px;
      background: #2563eb;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .back-btn {
      background: #6b7280;
      margin-bottom: 20px;
    }

    .content {
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 14px;
      display: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .content h2 {
      color: #2563eb;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .section {
      margin-bottom: 28px;
    }

    .section h3 {
      margin-bottom: 12px;
      color: #111827;
    }

    .section ul {
      padding-left: 25px;
    }

    .section li {
      margin-bottom: 9px;
      line-height: 1.5;
    }

    .note {
      margin-bottom: 12px;
      padding: 12px;
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      line-height: 1.5;
    }

    .note strong {
      color: #2563eb;
    }

    .quiz-question {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .quiz-question strong {
      display: block;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .quiz-result {
      font-weight: bold;
      margin-top: 10px;
    }

    .mock-exam {
      background: #eff6ff;
      padding: 18px;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .container {
        padding: 0 12px;
      }

      .content {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 UniFresh</h1>
  <p>Your University Freshman Study Companion</p>
</header>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search courses..."
  >

  <div id="courses" class="courses">
    <div class="loading">Loading courses...</div>
  </div>

  <div id="content" class="content"></div>

</div>

<script>

let courses = [];


/* =========================
   LOAD COURSES
========================= */

fetch("courses.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("courses.json not found");
    }

    return response.json();
  })
  .then(data => {

    courses = Array.isArray(data)
      ? data
      : (data.courses || []);

    displayCourses(courses);

  })
  .catch(error => {

    document.getElementById("courses").innerHTML = `
      <div class="error">
        <h3>⚠️ Course data could not be loaded.</h3>
        <p>
          Make sure <b>courses.json</b> is in the same folder
          as <b>index.html</b>.
        </p>
      </div>
    `;

    console.error(error);
  });


/* =========================
   DISPLAY COURSES
========================= */

function displayCourses(list) {

  const container = document.getElementById("courses");

  if (!list || list.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>No courses found.</h3>
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(course => {

    const originalIndex = courses.indexOf(course);

    return `
      <div class="course">

        <h2>
          📚 ${escapeHTML(course.name || "Unnamed Course")}
        </h2>

        <p>
          ${escapeHTML(
            course.description ||
            course.short_description ||
            "Freshman course"
          )}
        </p>

        <button onclick="showCourse(${originalIndex})">
          📖 Open Course
        </button>

      </div>
    `;

  }).join("");
}


/* =========================
   SHOW COURSE
========================= */

function showCourse(index) {

  const course = courses[index];

  if (!course) {
    return;
  }

  const content = document.getElementById("content");

  let html = `

    <button class="back-btn" onclick="backToCourses()">
      ← Back to Courses
    </button>

    <h2>
      📚 ${escapeHTML(course.name || "Course")}
    </h2>

  `;


  /* =========================
     TOPICS
  ========================= */

  if (Array.isArray(course.topics) && course.topics.length > 0) {

    html += `
      <div class="section">

        <h3>📌 Topics</h3>

        <ul>

          ${course.topics.map(topic => {

            const text =
              typeof topic === "string"
                ? topic
                : (
                    topic?.name ||
                    topic?.title ||
                    topic?.topic ||
                    ""
                  );

            return `
              <li>${escapeHTML(text)}</li>
            `;

          }).join("")}

        </ul>

      </div>
    `;
  }


  /* =========================
     SHORT NOTES
  ========================= */

  const notes = course.short_notes || course.notes;

  if (Array.isArray(notes) && notes.length > 0) {

    html += `
      <div class="section">

        <h3>📝 Short Notes</h3>

        ${notes.map(note => {

          if (typeof note === "string") {

            return `
              <div class="note">
                ${escapeHTML(note)}
              </div>
            `;

          }

          const title =
            note?.topic ||
            note?.title ||
            note?.name ||
            "";

          const text =
            note?.note ||
            note?.text ||
            note?.description ||
            "";

          return `
            <div class="note">

              ${
                title
                  ? `<strong>${escapeHTML(title)}:</strong> `
                  : ""
              }

              ${escapeHTML(text)}

            </div>
          `;

        }).join("")}

      </div>
    `;
  }


  /* =========================
     QUIZ
  ========================= */

  if (Array.isArray(course.quiz) && course.quiz.length > 0) {

    html += `
      <div class="section">

        <h3>❓ Practice Quiz</h3>
    `;

    course.quiz.forEach((q, i) => {

      const question =
        q?.question ||
        q?.text ||
        `Question ${i + 1}`;

      const options =
        Array.isArray(q?.options)
          ? q.options
          : [];

      html += `
        <div class="quiz-question">

          <strong>
            ${i + 1}. ${escapeHTML(question)}
          </strong>

          <div>

            ${options.map((option, optionIndex) => {

              return `
                <button
                  onclick="checkQuizAnswer(
                    this,
                    ${i},
                    ${optionIndex}
                  )"
                >
                  ${escapeHTML(String(option))}
                </button>
              `;

            }).join("")}

          </div>

          <div
            id="quiz-result-${i}"
            class="quiz-result"
          ></div>

        </div>
      `;

    });

    html += `
      </div>
    `;
  }


  /* =========================
     MOCK EXAM
  ========================= */

  if (course.mock_exam) {

    const mockExam = course.mock_exam;

    const questionCount =
      Array.isArray(mockExam.questions)
        ? mockExam.questions.length
        : (
            mockExam.number_of_questions ||
            "N/A"
          );

    html += `
      <div class="section">

        <h3>🎯 Mock Exam</h3>

        <div class="mock-exam">

          <p>
            <strong>Questions:</strong>
            ${escapeHTML(String(questionCount))}
          </p>

          <p>
            <strong>Duration:</strong>
            ${escapeHTML(
              String(mockExam.duration || "Not specified")
            )}
          </p>

          <br>

          <button onclick="startMockExam(${index})">
            🎯 Start Mock Exam
          </button>

        </div>

      </div>
    `;
  }


  content.innerHTML = html;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   QUIZ ANSWER
========================= */

function checkQuizAnswer(button, questionIndex, selectedIndex) {

  const course = getCurrentCourse();

  if (!course || !Array.isArray(course.quiz)) {
    return;
  }

  const question = course.quiz[questionIndex];

  if (!question) {
    return;
  }

  const result =
    document.getElementById(
      `quiz-result-${questionIndex}`
    );

  const selected =
    question.options?.[selectedIndex];

  const answer =
    question.answer;

  if (
    String(selected).trim().toLowerCase() ===
    String(answer).trim().toLowerCase()
  ) {

    button.innerHTML = "✅ Correct";
    button.style.background = "green";

    if (result) {
      result.innerHTML = "✅ Correct answer!";
      result.style.color = "green";
    }

  } else {

    button.innerHTML = "❌ Try Again";
    button.style.background = "red";

    if (result) {
      result.innerHTML = "❌ Incorrect. Try another answer.";
      result.style.color = "red";
    }
  }
}


/* =========================
   CURRENT COURSE
========================= */

let currentCourseIndex = null;

function getCurrentCourse() {

  if (currentCourseIndex === null) {
    return null;
  }

  return courses[currentCourseIndex];
}


/* =========================
   UPDATED SHOW COURSE
========================= */

const originalShowCourse = showCourse;

showCourse = function(index) {

  currentCourseIndex = index;

  originalShowCourse(index);
};


/* =========================
   BACK TO COURSES
========================= */

function backToCourses() {

  const content =
    document.getElementById("content");

  content.style.display = "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener("input", searchCourses);


function searchCourses() {

  const searchText =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const filtered = courses.filter(course => {

    const name =
      String(course.name || "").toLowerCase();

    const description =
      String(
        course.description ||
        course.short_description ||
        ""
      ).toLowerCase();

    return (
      name.includes(searchText) ||
      description.includes(searchText)
    );
  });

  displayCourses(filtered);
}


/* =========================
   MOCK EXAM
========================= */

function startMockExam(index) {

  const course = courses[index];

  if (
    !course ||
    !course.mock_exam ||
    !Array.isArray(course.mock_exam.questions)
  ) {

    alert(
      "Mock exam questions are not available yet."
    );

    return;
  }

  currentCourseIndex = index;

  const questions =
    course.mock_exam.questions;

  const content =
    document.getElementById("content");

  let exam = `

    <button
      class="back-btn"
      onclick="showCourse(${index})"
    >
      ← Back to Course
    </button>

    <h2>
      🎯 ${escapeHTML(course.name || "Course")}
      - Mock Exam
    </h2>
  `;


  questions.forEach((q, i) => {

    const question =
      q?.question ||
      q?.text ||
      `Question ${i + 1}`;

    const options =
      Array.isArray(q?.options)
        ? q.options
        : [];

    exam += `

      <div class="quiz-question">

        <strong>
          ${i + 1}. ${escapeHTML(question)}
        </strong>

        <div>

          ${options.map((option, optionIndex) => {

            return `
              <button
                onclick="checkMockAnswer(
                  this,
                  ${i},
                  ${optionIndex}
                )"
              >
                ${escapeHTML(String(option))}
              </button>
            `;

          }).join("")}

        </div>

        <div
          id="mock-result-${i}"
          class="quiz-result"
        ></div>

      </div>

    `;
  });


  content.innerHTML = exam;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   MOCK EXAM ANSWER
========================= */

function checkMockAnswer(
  button,
  questionIndex,
  selectedIndex
) {

  const course =
    getCurrentCourse();

  if (
    !course ||
    !course.mock_exam ||
    !Array.isArray(course.mock_exam.questions)
  ) {
    return;
  }

  const question =
    course.mock_exam.questions[questionIndex];

  if (!question) {
    return;
  }

  const selected =
    question.options?.[selectedIndex];

  const answer =
    question.answer;

  const result =
    document.getElementById(
      `mock-result-${questionIndex}`
    );


  if (
    String(selected).trim().toLowerCase() ===
    String(answer).trim().toLowerCase()
  ) {

    button.innerHTML = "✅ Correct";
    button.style.background = "green";

    if (result) {
      result.innerHTML = "✅ Correct answer!";
      result.style.color = "green";
    }

  } else {

    button.innerHTML = "❌ Try Again";
    button.style.background = "red";

    if (result) {
      result.innerHTML = "❌ Incorrect.";
      result.style.color = "red";
    }
  }
}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
