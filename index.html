<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UniFresh - Freshman Study Companion</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
      line-height: 1.6;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 17px;
      opacity: 0.95;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 25px;
    }

    .search:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* =========================
       COURSES
    ========================= */

    .courses {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );
      gap: 20px;
    }

    .course {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      transition: 0.2s ease;
    }

    .course:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.11);
    }

    .course h2 {
      color: #2563eb;
      margin-bottom: 10px;
      font-size: 22px;
      line-height: 1.3;
    }

    .course p {
      color: #6b7280;
      margin-bottom: 18px;
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 600;
      margin: 4px 2px;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .back-btn {
      background: #6b7280;
      margin-bottom: 20px;
    }

    .start-btn {
      background: #2563eb;
    }

    /* =========================
       COURSE CONTENT
    ========================= */

    .content {
      background: white;
      margin-top: 25px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      display: none;
    }

    .content h2 {
      color: #2563eb;
      font-size: 28px;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .section {
      margin-bottom: 32px;
    }

    .section > h3 {
      color: #111827;
      font-size: 21px;
      margin-bottom: 15px;
    }

    /* =========================
       TOPICS
    ========================= */

    .topics {
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px 25px;
    }

    .topics li {
      margin-bottom: 8px;
    }

    /* =========================
       CHAPTER NOTES
    ========================= */

    .chapter {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      background: white;
    }

    .chapter-title {
      background: #eff6ff;
      color: #2563eb;
      padding: 17px 20px;
      font-size: 19px;
      font-weight: bold;
      border-bottom: 1px solid #dbeafe;
    }

    .chapter-content {
      padding: 18px;
    }

    .note {
      background: #f8fafc;
      padding: 16px;
      border-radius: 9px;
      margin-bottom: 12px;
      border-left: 4px solid #2563eb;
    }

    .note:last-child {
      margin-bottom: 0;
    }

    .note-topic {
      color: #2563eb;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .note-text {
      color: #374151;
    }

    /* =========================
       QUIZ
    ========================= */

    .quiz-question {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .quiz-question strong {
      display: block;
      margin-bottom: 12px;
      color: #111827;
    }

    .quiz-result {
      font-weight: bold;
      margin-top: 10px;
    }

    /* =========================
       MOCK EXAM
    ========================= */

    .mock-exam {
      background: #eff6ff;
      padding: 20px;
      border-radius: 12px;
    }

    .mock-exam p {
      margin-bottom: 8px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 28px 15px;
      }

      header h1 {
        font-size: 28px;
      }

      .container {
        padding: 0 12px;
      }

      .content {
        padding: 18px;
      }

      .content h2 {
        font-size: 24px;
      }

      .chapter-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <h1>🎓 UniFresh</h1>
    <p>Your University Freshman Study Companion</p>
  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">

    <!-- SEARCH -->

    <input
      type="text"
      id="search"
      class="search"
      placeholder="Search courses..."
      autocomplete="off"
    >


    <!-- COURSES -->

    <div id="courses" class="courses">

      <div class="loading">
        Loading courses...
      </div>

    </div>


    <!-- COURSE CONTENT -->

    <div id="content" class="content"></div>

  </main>


  <script>

    /* =========================================
       GLOBAL VARIABLES
    ========================================= */

    let courses = [];
    let currentCourseIndex = null;


    /* =========================================
       LOAD courses.json
    ========================================= */

    fetch("./courses.json")

      .then(response => {

        if (!response.ok) {
          throw new Error("courses.json could not be loaded.");
        }

        return response.json();

      })

      .then(data => {

        if (Array.isArray(data)) {
          courses = data;
        } else {
          courses = data.courses || [];
        }

        displayCourses(courses);

      })

      .catch(error => {

        console.error(error);

        document.getElementById("courses").innerHTML = `

          <div class="error">

            <h3>
              ⚠️ Course data could not be loaded.
            </h3>

            <p>
              Make sure that
              <b>courses.json</b>
              is in the same folder as
              <b>index.html</b>.
            </p>

          </div>

        `;

      });


    /* =========================================
       DISPLAY COURSES
    ========================================= */

    function displayCourses(list) {

      const container =
        document.getElementById("courses");


      if (!list || list.length === 0) {

        container.innerHTML = `

          <div class="empty">

            <h3>
              No courses found.
            </h3>

          </div>

        `;

        return;
      }


      container.innerHTML = list.map(course => {

        /*
          IMPORTANT:
          We use the original course index.
          This prevents the Open Course button
          from opening the wrong course after search.
        */

        const originalIndex =
          courses.indexOf(course);


        return `

          <div class="course">

            <h2>
              📚
              ${escapeHTML(
                course.name || "Unnamed Course"
              )}
            </h2>

            <p>
              ${escapeHTML(
                course.description ||
                course.short_description ||
                "Freshman course"
              )}
            </p>

            <button
              onclick="showCourse(${originalIndex})"
            >
              📖 Open Course
            </button>

          </div>

        `;

      }).join("");

    }


    /* =========================================
       SHOW COURSE
    ========================================= */

    function showCourse(index) {

      const course = courses[index];

      if (!course) {
        return;
      }


      currentCourseIndex = index;


      const content =
        document.getElementById("content");


      let html = `

        <button
          class="back-btn"
          onclick="backToCourses()"
        >
          ← Back to Courses
        </button>

        <h2>
          📚
          ${escapeHTML(
            course.name || "Course"
          )}
        </h2>

      `;


      /* =====================================
         TOPICS
      ===================================== */

      if (
        Array.isArray(course.topics) &&
        course.topics.length > 0
      ) {

        html += `

          <div class="section">

            <h3>
              📌 Topics
            </h3>

            <div class="topics">

              <ul>

                ${course.topics.map(topic => {

                  const topicText =
                    typeof topic === "string"
                      ? topic
                      : (
                          topic?.name ||
                          topic?.title ||
                          topic?.topic ||
                          ""
                        );

                  return `

                    <li>
                      ${escapeHTML(topicText)}
                    </li>

                  `;

                }).join("")}

              </ul>

            </div>

          </div>

        `;

      }


      /* =====================================
         CHAPTER-BY-CHAPTER SHORT NOTES
      ===================================== */

      if (
        Array.isArray(course.short_notes) &&
        course.short_notes.length > 0
      ) {

        html += `

          <div class="section">

            <h3>
              📝 Short Notes
            </h3>

        `;


        course.short_notes.forEach(
          (chapter, chapterIndex) => {

            html += `

              <div class="chapter">

                <div class="chapter-title">

                  📖
                  ${escapeHTML(
                    chapter.chapter ||
                    `Chapter ${chapterIndex + 1}`
                  )}

                </div>

                <div class="chapter-content">

            `;


            if (
              Array.isArray(chapter.notes) &&
              chapter.notes.length > 0
            ) {

              chapter.notes.forEach(note => {

                const topic =
                  note?.topic ||
                  note?.title ||
                  "";


                const noteText =
                  note?.note ||
                  note?.text ||
                  note?.description ||
                  "";


                html += `

                  <div class="note">

                    ${
                      topic
                        ? `
                          <div class="note-topic">
                            ${escapeHTML(topic)}
                          </div>
                        `
                        : ""
                    }

                    <div class="note-text">
                      ${escapeHTML(noteText)}
                    </div>

                  </div>

                `;

              });

            } else {

              html += `

                <div class="note">

                  <div class="note-text">
                    No notes available for this chapter.
                  </div>

                </div>

              `;

            }


            html += `

                </div>

              </div>

            `;

          }
        );


        html += `

          </div>

        `;

      }


      /* =====================================
         QUIZ
      ===================================== */

      if (
        Array.isArray(course.quiz) &&
        course.quiz.length > 0
      ) {

        html += `

          <div class="section">

            <h3>
              ❓ Practice Quiz
            </h3>

        `;


        course.quiz.forEach((q, i) => {

          const question =
            q?.question ||
            q?.text ||
            `Question ${i + 1}`;


          const options =
            Array.isArray(q?.options)
              ? q.options
              : [];


          html += `

            <div class="quiz-question">

              <strong>
                ${i + 1}.
                ${escapeHTML(question)}
              </strong>

              <div>

                ${
                  options.length > 0

                    ? options.map(
                        (option, optionIndex) => `

                          <button
                            onclick="
                              checkQuizAnswer(
                                ${i},
                                ${optionIndex},
                                this
                              )
                            "
                          >
                            ${escapeHTML(
                              String(option)
                            )}
                          </button>

                        `
                      ).join("")

                    : `
                      <p>
                        No options available.
                      </p>
                    `
                }

              </div>

              <div
                id="quiz-result-${i}"
                class="quiz-result"
              ></div>

            </div>

          `;

        });


        html += `

          </div>

        `;

      }


      /* =====================================
         MOCK EXAM
      ===================================== */

      if (course.mock_exam) {

        const exam =
          course.mock_exam;


        const questionCount =
          Array.isArray(exam.questions)
            ? exam.questions.length
            : (
                exam.number_of_questions ||
                "N/A"
              );


        html += `

          <div class="section">

            <h3>
              🎯 Mock Exam
            </h3>

            <div class="mock-exam">

              <p>
                <strong>
                  Questions:
                </strong>

                ${escapeHTML(
                  String(questionCount)
                )}
              </p>

              <p>
                <strong>
                  Duration:
                </strong>

                ${escapeHTML(
                  String(
                    exam.duration ||
                    "Not specified"
                  )
                )}
              </p>

              <br>

              <button
                class="start-btn"
                onclick="
                  startMockExam(${index})
                "
              >
                🎯 Start Mock Exam
              </button>

            </div>

          </div>

        `;

      }


      /* =====================================
         SHOW CONTENT
      ===================================== */

      content.innerHTML = html;

      content.style.display = "block";


      content.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* =========================================
       QUIZ ANSWER
    ========================================= */

    function checkQuizAnswer(
      questionIndex,
      selectedIndex,
      button
    ) {

      const course =
        courses[currentCourseIndex];


      if (
        !course ||
        !Array.isArray(course.quiz)
      ) {
        return;
      }


      const question =
        course.quiz[questionIndex];


      if (!question) {
        return;
      }


      const selected =
        question.options?.[selectedIndex];


      const correctAnswer =
        question.answer;


      const result =
        document.getElementById(
          `quiz-result-${questionIndex}`
        );


      const isCorrect =
        String(selected)
          .trim()
          .toLowerCase() ===
        String(correctAnswer)
          .trim()
          .toLowerCase();


      if (isCorrect) {

        button.innerHTML =
          "✅ Correct";

        button.style.background =
          "green";


        if (result) {

          result.innerHTML =
            "✅ Correct answer!";

          result.style.color =
            "green";
        }

      } else {

        button.innerHTML =
          "❌ Try Again";

        button.style.background =
          "red";


        if (result) {

          result.innerHTML =
            "❌ Incorrect. Try another answer.";

          result.style.color =
            "red";
        }

      }

    }


    /* =========================================
       SEARCH
    ========================================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        searchCourses
      );


    function searchCourses() {

      const text =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        courses.filter(course => {

          const name =
            String(
              course.name || ""
            ).toLowerCase();


          const description =
            String(
              course.description ||
              course.short_description ||
              ""
            ).toLowerCase();


          return (
            name.includes(text) ||
            description.includes(text)
          );

        });


      displayCourses(filtered);

    }


    /* =========================================
       BACK TO COURSES
    ========================================= */

    function backToCourses() {

      const content =
        document.getElementById("content");


      content.style.display =
        "none";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================
       START MOCK EXAM
    ========================================= */

    function startMockExam(index) {

      const course =
        courses[index];


      if (
        !course ||
        !course.mock_exam ||
        !Array.isArray(
          course.mock_exam.questions
        )
      ) {

        alert(
          "Mock exam questions are not available yet."
        );

        return;
      }


      currentCourseIndex = index;


      const questions =
        course.mock_exam.questions;


      const content =
        document.getElementById("content");


      let examHTML = `

        <button
          class="back-btn"
          onclick="showCourse(${index})"
        >
          ← Back to Course
        </button>

        <h2>
          🎯
          ${escapeHTML(
            course.name || "Course"
          )}
          - Mock Exam
        </h2>

      `;


      questions.forEach((q, i) => {

        const question =
          q?.question ||
          q?.text ||
          `Question ${i + 1}`;


        const options =
          Array.isArray(q?.options)
            ? q.options
            : [];


        examHTML += `

          <div class="quiz-question">

            <strong>
              ${i + 1}.
              ${escapeHTML(question)}
            </strong>

            <div>

              ${
                options.map(
                  (option, optionIndex) => `

                    <button
                      onclick="
                        checkMockAnswer(
                          ${i},
                          ${optionIndex},
                          this
                        )
                      "
                    >
                      ${escapeHTML(
                        String(option)
                      )}
                    </button>

                  `
                ).join("")
              }

            </div>

            <div
              id="mock-result-${i}"
              class="quiz-result"
            ></div>

          </div>

        `;

      });


      content.innerHTML =
        examHTML;


      content.style.display =
        "block";


      content.scrollIntoView({
        behavior: "smooth"
      });

    }


    /* =========================================
       MOCK EXAM ANSWER
    ========================================= */

    function checkMockAnswer(
      questionIndex,
      selectedIndex,
      button
    ) {

      const course =
        courses[currentCourseIndex];


      if (
        !course ||
        !course.mock_exam ||
        !Array.isArray(
          course.mock_exam.questions
        )
      ) {
        return;
      }


      const question =
        course.mock_exam.questions[
          questionIndex
        ];


      if (!question) {
        return;
      }


      const selected =
        question.options?.[
          selectedIndex
        ];


      const correctAnswer =
        question.answer;


      const result =
        document.getElementById(
          `mock-result-${questionIndex}`
        );


      const isCorrect =
        String(selected)
          .trim()
          .toLowerCase() ===
        String(correctAnswer)
          .trim()
          .toLowerCase();


      if (isCorrect) {

        button.innerHTML =
          "✅ Correct";

        button.style.background =
          "green";


        if (result) {

          result.innerHTML =
            "✅ Correct answer!";

          result.style.color =
            "green";
        }

      } else {

        button.innerHTML =
          "❌ Try Again";

        button.style.background =
          "red";


        if (result) {

          result.innerHTML =
            "❌ Incorrect.";

          result.style.color =
            "red";
        }

      }

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>
