<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniFresh - Freshman Courses</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .course {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .course h2 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    .course p {
      color: #666;
      margin-bottom: 15px;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 2px;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .content {
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 14px;
      display: none;
    }

    .content h2 {
      color: #2563eb;
      margin-bottom: 15px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h3 {
      margin-bottom: 10px;
      color: #111827;
    }

    .section ul {
      padding-left: 25px;
    }

    .section li {
      margin-bottom: 8px;
    }

    .quiz-question {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 UniFresh</h1>
  <p>Your University Freshman Study Companion</p>
</header>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search courses..."
    onkeyup="searchCourses()"
  >

  <div id="courses" class="courses">
    <div class="loading">Loading courses...</div>
  </div>

  <div id="content" class="content"></div>

</div>

<script>

let courses = [];

/* Load courses.json */
fetch("courses.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("courses.json not found");
    }
    return response.json();
  })
  .then(data => {
    courses = data.courses || data;
    displayCourses(courses);
  })
  .catch(error => {
    document.getElementById("courses").innerHTML = `
      <div class="error">
        <h3>⚠️ Course data could not be loaded.</h3>
        <p>Make sure <b>courses.json</b> is in the same folder as index.html.</p>
      </div>
    `;
    console.error(error);
  });


/* Display all courses */
function displayCourses(list) {

  const container = document.getElementById("courses");

  if (!list || list.length === 0) {
    container.innerHTML = "<p>No courses found.</p>";
    return;
  }

  container.innerHTML = list.map((course, index) => `

    <div class="course">

      <h2>📚 ${course.name || "Unnamed Course"}</h2>

      <p>
        ${course.description || course.short_description || "Freshman course"}
      </p>

      <button onclick="showCourse(${index})">
        📖 Open Course
      </button>

    </div>

  `).join("");
}


/* Show selected course */
function showCourse(index) {

  const course = courses[index];

  const content = document.getElementById("content");

  let html = `
    <h2>📚 ${course.name || "Course"}</h2>
  `;


  /* Topics */
  if (course.topics) {

    html += `
      <div class="section">
        <h3>📌 Topics</h3>
        <ul>
          ${course.topics.map(topic => `
            <li>${typeof topic === "string" ? topic : topic.name}</li>
          `).join("")}
        </ul>
      </div>
    `;

  }


  /* Short Notes */
  if (course.short_notes || course.notes) {

    const notes = course.short_notes || course.notes;

    html += `
      <div class="section">
        <h3>📝 Short Notes</h3>
        <ul>
          ${notes.map(note => `
            <li>${typeof note === "string" ? note : note.title || note.text}</li>
          `).join("")}
        </ul>
      </div>
    `;

  }


  /* Quiz */
  if (course.quiz) {

    html += `
      <div class="section">
        <h3>❓ Practice Quiz</h3>
      `;

    course.quiz.forEach((q, i) => {

      html += `
        <div class="quiz-question">

          <strong>
            ${i + 1}. ${q.question}
          </strong>

          <br><br>

          ${
            q.options
              ? q.options.map(option => `
                  <button onclick="checkAnswer(this, '${escapeAnswer(q.answer)}', '${escapeAnswer(option)}')">
                    ${option}
                  </button>
                `).join("")
              : ""
          }

        </div>
      `;

    });

    html += `</div>`;
  }


  /* Mock Exam */
  if (course.mock_exam) {

    html += `
      <div class="section">

        <h3>🎯 Mock Exam</h3>

        <p>
          Questions:
          ${course.mock_exam.questions
            ? course.mock_exam.questions.length
            : course.mock_exam.number_of_questions || "N/A"}
        </p>

        <p>
          Duration:
          ${course.mock_exam.duration || "Not specified"}
        </p>

        <button onclick="startMockExam(${index})">
          Start Mock Exam
        </button>

      </div>
    `;

  }


  content.innerHTML = html;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });
}


/* Quiz answer checker */
function checkAnswer(button, answer, selected) {

  if (answer === selected) {

    button.style.background = "green";
    button.innerHTML = "✅ Correct";

  } else {

    button.style.background = "red";
    button.innerHTML = "❌ Try Again";

  }

}


/* Search courses */
function searchCourses() {

  const searchText =
    document.getElementById("search").value.toLowerCase();

  const filtered = courses.filter(course =>
    (course.name || "").toLowerCase().includes(searchText)
  );

  displayCourses(filtered);
}


/* Mock exam */
function startMockExam(index) {

  const course = courses[index];

  if (!course.mock_exam || !course.mock_exam.questions) {
    alert("Mock exam questions are not available yet.");
    return;
  }

  const questions = course.mock_exam.questions;

  let exam = `
    <h2>🎯 ${course.name} - Mock Exam</h2>
  `;

  questions.forEach((q, i) => {

    exam += `
      <div class="quiz-question">

        <strong>
          ${i + 1}. ${q.question}
        </strong>

        <br><br>

        ${
          q.options
            ? q.options.map(option => `
                <button onclick="checkAnswer(
                  this,
                  '${escapeAnswer(q.answer)}',
                  '${escapeAnswer(option)}'
                )">
                  ${option}
                </button>
              `).join("")
            : ""
        }

      </div>
    `;

  });

  const content = document.getElementById("content");

  content.innerHTML = exam;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });
}


/* Prevent quote errors */
function escapeAnswer(text) {

  if (!text) return "";

  return String(text)
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');

}

</script>

</body>
</html>
