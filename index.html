<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UniFresh - Freshman Courses</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
      font-size: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: #2563eb;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .course {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .course h2 {
      color: #2563eb;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .course p {
      color: #666;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 2px;
      background: #2563eb;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .content {
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 14px;
      display: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .content h2 {
      color: #2563eb;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h3 {
      margin-bottom: 12px;
      color: #111827;
    }

    .section ul {
      padding-left: 25px;
    }

    .section li {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .note-item {
      margin-bottom: 12px;
    }

    .note-topic {
      font-weight: bold;
      color: #2563eb;
    }

    .quiz-question {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .quiz-question strong {
      display: block;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .quiz-option {
      margin: 4px 3px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .no-results {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      color: #666;
    }

    .back-button {
      background: #6b7280;
      margin-bottom: 20px;
    }

    .correct {
      background: green !important;
    }

    .wrong {
      background: red !important;
    }

    .exam-info {
      background: #eff6ff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎓 UniFresh</h1>
    <p>Your University Freshman Study Companion</p>
  </header>

  <div class="container">

    <input
      type="text"
      id="search"
      class="search"
      placeholder="Search courses..."
      oninput="searchCourses()"
    >

    <div id="courses" class="courses">
      <div class="loading">Loading courses...</div>
    </div>

    <div id="content" class="content"></div>

  </div>

  <script>

    let courses = [];

    /* ================================
       LOAD COURSES
    ================================= */

    fetch("courses.json")
      .then(response => {

        if (!response.ok) {
          throw new Error("courses.json not found");
        }

        return response.json();
      })

      .then(data => {

        courses = Array.isArray(data)
          ? data
          : (data.courses || []);

        displayCourses(courses);

      })

      .catch(error => {

        document.getElementById("courses").innerHTML = `
          <div class="error">
            <h3>⚠️ Course data could not be loaded.</h3>
            <p>
              Make sure <b>courses.json</b> is in the same folder
              as <b>index.html</b>.
            </p>
          </div>
        `;

        console.error(error);

      });


    /* ================================
       DISPLAY COURSES
    ================================= */

    function displayCourses(list) {

      const container = document.getElementById("courses");

      if (!list || list.length === 0) {

        container.innerHTML = `
          <div class="no-results">
            No courses found.
          </div>
        `;

        return;
      }

      container.innerHTML = list.map(course => {

        const originalIndex = courses.indexOf(course);

        return `
          <div class="course">

            <h2>
              📚 ${escapeHTML(course.name || "Unnamed Course")}
            </h2>

            <p>
              ${escapeHTML(
                course.description ||
                course.short_description ||
                "Freshman course"
              )}
            </p>

            <button onclick="showCourse(${originalIndex})">
              📖 Open Course
            </button>

          </div>
        `;

      }).join("");
    }


    /* ================================
       SHOW COURSE
    ================================= */

    function showCourse(index) {

      const course = courses[index];

      if (!course) {
        return;
      }

      const content = document.getElementById("content");

      let html = `

        <button class="back-button" onclick="closeCourse()">
          ← Back to Courses
        </button>

        <h2>
          📚 ${escapeHTML(course.name || "Course")}
        </h2>

      `;


      /* ================================
         TOPICS
      ================================= */

      if (Array.isArray(course.topics) && course.topics.length > 0) {

        html += `

          <div class="section">

            <h3>📌 Topics</h3>

            <ul>

              ${course.topics.map(topic => {

                if (typeof topic === "string") {
                  return `<li>${escapeHTML(topic)}</li>`;
                }

                return `
                  <li>
                    ${escapeHTML(
                      topic.name ||
                      topic.topic ||
                      ""
                    )}
                  </li>
                `;

              }).join("")}

            </ul>

          </div>

        `;
      }


      /* ================================
         SHORT NOTES
      ================================= */

      const notes =
        course.short_notes ||
        course.notes ||
        [];

      if (Array.isArray(notes) && notes.length > 0) {

        html += `

          <div class="section">

            <h3>📝 Short Notes</h3>

            <ul>

              ${notes.map(note => {

                if (typeof note === "string") {

                  return `
                    <li class="note-item">
                      ${escapeHTML(note)}
                    </li>
                  `;

                }

                const topic =
                  note.topic ||
                  note.title ||
                  "";

                const text =
                  note.note ||
                  note.text ||
                  note.description ||
                  "";

                return `
                  <li class="note-item">

                    ${
                      topic
                        ? `<span class="note-topic">
                             ${escapeHTML(topic)}:
                           </span> `
                        : ""
                    }

                    ${escapeHTML(text)}

                  </li>
                `;

              }).join("")}

            </ul>

          </div>

        `;
      }


      /* ================================
         PRACTICE QUIZ
      ================================= */

      if (Array.isArray(course.quiz) && course.quiz.length > 0) {

        html += `

          <div class="section">

            <h3>❓ Practice Quiz</h3>

        `;

        course.quiz.forEach((q, i) => {

          html += `

            <div class="quiz-question">

              <strong>
                ${i + 1}. ${escapeHTML(
                  q.question || "Question"
                )}
              </strong>

              <div>

                ${
                  Array.isArray(q.options)
                    ? q.options.map(option => {

                        return `
                          <button
                            class="quiz-option"
                            onclick="
                              checkAnswer(
                                this,
                                '${escapeJS(q.answer)}',
                                '${escapeJS(option)}'
                              )
                            "
                          >
                            ${escapeHTML(option)}
                          </button>
                        `;

                      }).join("")
                    : ""
                }

              </div>

            </div>

          `;

        });

        html += `</div>`;
      }


      /* ================================
         MOCK EXAM
      ================================= */

      if (course.mock_exam) {

        const questions =
          Array.isArray(course.mock_exam.questions)
            ? course.mock_exam.questions
            : [];

        const numberOfQuestions =
          questions.length ||
          course.mock_exam.number_of_questions ||
          "N/A";

        const duration =
          course.mock_exam.duration ||
          "Not specified";

        html += `

          <div class="section">

            <h3>🎯 Mock Exam</h3>

            <div class="exam-info">

              <p>
                <strong>Questions:</strong>
                ${escapeHTML(String(numberOfQuestions))}
              </p>

              <p>
                <strong>Duration:</strong>
                ${escapeHTML(String(duration))}
              </p>

            </div>

            ${
              questions.length > 0
                ? `
                  <button onclick="startMockExam(${index})">
                    ▶️ Start Mock Exam
                  </button>
                `
                : `
                  <p>
                    Mock exam questions are not available yet.
                  </p>
                `
            }

          </div>

        `;
      }


      content.innerHTML = html;

      content.style.display = "block";

      content.scrollIntoView({
        behavior: "smooth"
      });
    }


    /* ================================
       CLOSE COURSE
    ================================= */

    function closeCourse() {

      const content = document.getElementById("content");

      content.style.display = "none";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* ================================
       CHECK QUIZ ANSWER
    ================================= */

    function checkAnswer(button, answer, selected) {

      if (answer === selected) {

        button.classList.remove("wrong");
        button.classList.add("correct");

        button.innerHTML = "✅ Correct";

      } else {

        button.classList.remove("correct");
        button.classList.add("wrong");

        button.innerHTML = "❌ Try Again";
      }
    }


    /* ================================
       SEARCH COURSES
    ================================= */

    function searchCourses() {

      const searchText =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      const filtered = courses.filter(course => {

        const name =
          String(course.name || "").toLowerCase();

        const description =
          String(
            course.description ||
            course.short_description ||
            ""
          ).toLowerCase();

        return (
          name.includes(searchText) ||
          description.includes(searchText)
        );

      });

      displayCourses(filtered);
    }


    /* ================================
       START MOCK EXAM
    ================================= */

    function startMockExam(index) {

      const course = courses[index];

      if (
        !course ||
        !course.mock_exam ||
        !Array.isArray(course.mock_exam.questions)
      ) {

        alert(
          "Mock exam questions are not available yet."
        );

        return;
      }

      const questions =
        course.mock_exam.questions;

      const content =
        document.getElementById("content");

      let exam = `

        <button
          class="back-button"
          onclick="showCourse(${index})"
        >
          ← Back to Course
        </button>

        <h2>
          🎯 ${escapeHTML(
            course.name || "Course"
          )} - Mock Exam
        </h2>

      `;


      questions.forEach((q, i) => {

        exam += `

          <div class="quiz-question">

            <strong>
              ${i + 1}. ${escapeHTML(
                q.question || "Question"
              )}
            </strong>

            <div>

              ${
                Array.isArray(q.options)
                  ? q.options.map(option => {

                      return `
                        <button
                          class="quiz-option"
                          onclick="
                            checkAnswer(
                              this,
                              '${escapeJS(q.answer)}',
                              '${escapeJS(option)}'
                            )
                          "
                        >
                          ${escapeHTML(option)}
                        </button>
                      `;

                    }).join("")
                  : ""
              }

            </div>

          </div>

        `;

      });


      content.innerHTML = exam;

      content.style.display = "block";

      content.scrollIntoView({
        behavior: "smooth"
      });
    }


    /* ================================
       HTML ESCAPE
    ================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* ================================
       JAVASCRIPT STRING ESCAPE
    ================================= */

    function escapeJS(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
    }

  </script>

</body>
</html>
