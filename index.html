<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UniFresh - Freshman Study Companion</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      margin-bottom: 25px;
    }

    .search:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .course {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
      transition: 0.2s;
    }

    .course:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .course h2 {
      color: #2563eb;
      font-size: 21px;
      margin-bottom: 10px;
    }

    .course p {
      color: #6b7280;
      margin-bottom: 15px;
    }

    .chapter-count {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      margin: 4px 3px;
      background: #2563eb;
      color: white;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back-button {
      background: #6b7280;
      margin-bottom: 20px;
    }

    .back-button:hover {
      background: #4b5563;
    }

    .content {
      background: white;
      margin-top: 30px;
      padding: 28px;
      border-radius: 16px;
      display: none;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .content > h2 {
      color: #2563eb;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .course-description {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .topics-box {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .topics-box h3 {
      margin-bottom: 10px;
      color: #111827;
    }

    .topics-box ul {
      padding-left: 22px;
    }

    .chapter {
      border: 1px solid #dbeafe;
      border-radius: 15px;
      margin-bottom: 25px;
      overflow: hidden;
      background: white;
    }

    .chapter-header {
      background: #eff6ff;
      padding: 20px;
      border-bottom: 1px solid #dbeafe;
    }

    .chapter-header h3 {
      color: #1d4ed8;
      font-size: 21px;
    }

    .chapter-body {
      padding: 22px;
    }

    .chapter-body h4 {
      color: #2563eb;
      margin: 20px 0 8px;
      font-size: 17px;
    }

    .chapter-body p {
      margin-bottom: 13px;
      color: #374151;
    }

    .chapter-body ul {
      padding-left: 24px;
      margin-bottom: 15px;
    }

    .chapter-body li {
      margin-bottom: 8px;
    }

    .example-box {
      background: #f9fafb;
      border-left: 4px solid #2563eb;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
    }

    .important-box {
      background: #fff7ed;
      border-left: 4px solid #f97316;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
    }

    .quiz-section {
      margin-top: 35px;
    }

    .quiz-section h3 {
      color: #2563eb;
      margin-bottom: 18px;
      font-size: 23px;
    }

    .quiz-question {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .quiz-question strong {
      display: block;
      margin-bottom: 12px;
    }

    .quiz-question button.correct {
      background: #16a34a !important;
    }

    .quiz-question button.wrong {
      background: #dc2626 !important;
    }

    .mock-exam {
      margin-top: 30px;
      padding: 22px;
      background: #eef2ff;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }

      .container {
        padding: 0 12px;
      }

      .content {
        padding: 18px;
      }

      .chapter-body {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 UniFresh</h1>
  <p>Your University Freshman Study Companion</p>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search courses..."
    onkeyup="searchCourses()"
  >

  <div id="courses" class="courses">
    <div class="loading">
      Loading courses...
    </div>
  </div>

  <div id="content" class="content"></div>

</div>

<script>

let courses = [];


/* ==============================
   LOAD COURSES
============================== */

fetch("courses.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("courses.json could not be loaded.");
    }

    return response.json();
  })

  .then(data => {

    courses = data.courses || data;

    displayCourses(courses);

  })

  .catch(error => {

    document.getElementById("courses").innerHTML = `
      <div class="error">
        <h3>⚠️ Course data could not be loaded.</h3>
        <p>
          Make sure that <b>courses.json</b> is in the same
          GitHub folder as <b>index.html</b>.
        </p>
      </div>
    `;

    console.error(error);
  });


/* ==============================
   DISPLAY COURSES
============================== */

function displayCourses(list) {

  const container = document.getElementById("courses");

  if (!list || list.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No courses found.
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(course => {

    const realIndex = courses.indexOf(course);

    return `

      <div class="course">

        <h2>
          ${course.icon || "📚"}
          ${escapeHTML(course.name || "Unnamed Course")}
        </h2>

        <p>
          ${escapeHTML(
            course.description ||
            "Freshman university course"
          )}
        </p>

        <span class="chapter-count">
          📖 ${course.chapters ? course.chapters.length : 0}
          Chapters
        </span>

        <br>

        <button onclick="showCourse(${realIndex})">
          📖 Open Course
        </button>

      </div>

    `;

  }).join("");
}


/* ==============================
   SHOW COURSE
============================== */

function showCourse(index) {

  const course = courses[index];

  if (!course) return;

  const content = document.getElementById("content");

  let html = `

    <button class="back-button" onclick="backToCourses()">
      ← Back to Courses
    </button>

    <h2>
      ${course.icon || "📚"}
      ${escapeHTML(course.name)}
    </h2>

    <p class="course-description">
      ${escapeHTML(course.description || "")}
    </p>

  `;


  /* ==========================
     TOPICS
  ========================== */

  if (course.topics && course.topics.length > 0) {

    html += `

      <div class="topics-box">

        <h3>📌 Topics</h3>

        <ul>

          ${course.topics.map(topic => `
            <li>${escapeHTML(topic)}</li>
          `).join("")}

        </ul>

      </div>

    `;
  }


  /* ==========================
     CHAPTER NOTES
  ========================== */

  if (course.chapters && course.chapters.length > 0) {

    html += `

      <h3 style="color:#2563eb; margin-bottom:20px;">
        📝 Detailed Chapter Notes
      </h3>

    `;

    course.chapters.forEach((chapter, chapterIndex) => {

      html += `

        <div class="chapter">

          <div class="chapter-header">

            <h3>
              📘 Chapter ${chapterIndex + 1}:
              ${escapeHTML(chapter.title)}
            </h3>

          </div>

          <div class="chapter-body">

            <h4>📖 Chapter Overview</h4>

            <p>
              ${escapeHTML(chapter.overview || "")}
            </p>

      `;


      /* Sections */

      if (chapter.sections) {

        chapter.sections.forEach(section => {

          html += `

            <h4>
              ${escapeHTML(section.title)}
            </h4>

          `;

          if (section.paragraphs) {

            section.paragraphs.forEach(paragraph => {

              html += `
                <p>
                  ${escapeHTML(paragraph)}
                </p>
              `;

            });

          }

          if (section.points) {

            html += `
              <ul>
                ${section.points.map(point => `
                  <li>${escapeHTML(point)}</li>
                `).join("")}
              </ul>
            `;

          }

          if (section.example) {

            html += `

              <div class="example-box">

                <strong>💡 Example:</strong>

                <p>
                  ${escapeHTML(section.example)}
                </p>

              </div>

            `;

          }

          if (section.important) {

            html += `

              <div class="important-box">

                <strong>⭐ Important:</strong>

                <p>
                  ${escapeHTML(section.important)}
                </p>

              </div>

            `;

          }

        });

      }


      /* Key points */

      if (chapter.key_points) {

        html += `

          <h4>⭐ Key Points to Remember</h4>

          <ul>

            ${chapter.key_points.map(point => `
              <li>${escapeHTML(point)}</li>
            `).join("")}

          </ul>

        `;

      }


      html += `

          </div>

        </div>

      `;

    });

  }


  /* ==========================
     QUIZ
  ========================== */

  if (course.quiz && course.quiz.length > 0) {

    html += `

      <div class="quiz-section">

        <h3>
          ❓ Practice Quiz
        </h3>

    `;

    course.quiz.forEach((q, i) => {

      html += `

        <div class="quiz-question">

          <strong>
            ${i + 1}. ${escapeHTML(q.question)}
          </strong>

      `;

      if (q.options) {

        q.options.forEach(option => {

          html += `

            <button
              onclick="checkAnswer(
                this,
                ${JSON.stringify(q.answer)},
                ${JSON.stringify(option)}
              )"
            >
              ${escapeHTML(option)}
            </button>

          `;

        });

      }

      html += `

        </div>

      `;

    });

    html += `</div>`;

  }


  /* ==========================
     MOCK EXAM
  ========================== */

  if (course.mock_exam) {

    html += `

      <div class="mock-exam">

        <h3>🎯 Mock Exam</h3>

        <p>
          ${escapeHTML(
            course.mock_exam.description ||
            "Test yourself using this practice exam."
          )}
        </p>

        <br>

        <p>
          <b>Questions:</b>
          ${
            course.mock_exam.questions
              ? course.mock_exam.questions.length
              : "N/A"
          }
        </p>

        <p>
          <b>Duration:</b>
          ${escapeHTML(course.mock_exam.duration || "Not specified")}
        </p>

        <br>

        <button onclick="startMockExam(${index})">
          🎯 Start Mock Exam
        </button>

      </div>

    `;

  }


  content.innerHTML = html;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });
}


/* ==============================
   BACK TO COURSES
============================== */

function backToCourses() {

  document.getElementById("content").style.display = "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==============================
   QUIZ CHECKER
============================== */

function checkAnswer(button, answer, selected) {

  const buttons =
    button.parentElement.querySelectorAll("button");

  buttons.forEach(btn => {
    btn.disabled = true;
  });

  if (answer === selected) {

    button.classList.add("correct");

    button.innerHTML = "✅ Correct";

  } else {

    button.classList.add("wrong");

    button.innerHTML = "❌ Wrong";

    buttons.forEach(btn => {

      if (btn.textContent.trim() === answer) {

        btn.classList.add("correct");
        btn.innerHTML = "✅ Correct Answer";

      }

    });

  }

}


/* ==============================
   SEARCH
============================== */

function searchCourses() {

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered = courses.filter(course => {

    const name =
      (course.name || "").toLowerCase();

    const description =
      (course.description || "").toLowerCase();

    const topics =
      (course.topics || [])
        .join(" ")
        .toLowerCase();

    return (
      name.includes(text) ||
      description.includes(text) ||
      topics.includes(text)
    );

  });

  displayCourses(filtered);
}


/* ==============================
   MOCK EXAM
============================== */

function startMockExam(index) {

  const course = courses[index];

  if (
    !course.mock_exam ||
    !course.mock_exam.questions
  ) {

    alert("Mock exam questions are not available yet.");

    return;
  }

  const questions =
    course.mock_exam.questions;

  const content =
    document.getElementById("content");

  let exam = `

    <button class="back-button"
      onclick="showCourse(${index})">
      ← Back to Course
    </button>

    <h2>
      🎯 ${escapeHTML(course.name)} - Mock Exam
    </h2>

    <br>

  `;


  questions.forEach((q, i) => {

    exam += `

      <div class="quiz-question">

        <strong>
          ${i + 1}. ${escapeHTML(q.question)}
        </strong>

        <br>

    `;

    if (q.options) {

      q.options.forEach(option => {

        exam += `

          <button
            onclick="checkAnswer(
              this,
              ${JSON.stringify(q.answer)},
              ${JSON.stringify(option)}
            )"
          >
            ${escapeHTML(option)}
          </button>

        `;

      });

    }

    exam += `

      </div>

    `;

  });


  content.innerHTML = exam;

  content.style.display = "block";

  content.scrollIntoView({
    behavior: "smooth"
  });

}


/* ==============================
   HTML SAFETY
============================== */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
